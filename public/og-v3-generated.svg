<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bot Directory — Find a bot. Copy the prompt.">
  <defs>
    <style>
      @font-face {
        font-family: "Aeonik";
        src: url("fonts/aeonik-medium.woff") format("woff");
        font-weight: 500;
      }
      @font-face {
        font-family: "Geist";
        src: url("fonts/geist-latin.woff2") format("woff2");
        font-weight: 400 700;
      }
    </style>
  </defs>

  <image href="images/bot-directory-og-generated-background.png" width="1200" height="630" preserveAspectRatio="xMidYMid slice" />

  <g transform="translate(70 52)">
    <rect width="38" height="38" rx="9" fill="#FFFFFF" />
    <text x="19" y="29" fill="#2965EC" font-family="Aeonik, sans-serif" font-size="30" font-weight="500" text-anchor="middle">b</text>
    <text x="55" y="29" fill="#FFFFFF" font-family="Aeonik, sans-serif" font-size="27" font-weight="500">botdirectory.ai</text>
  </g>

  <text x="68" y="274" fill="#FFFFFF" font-family="Aeonik, sans-serif" font-size="82" font-weight="500" letter-spacing="-1.8">Find a bot.</text>
  <text x="68" y="360" fill="#FFFFFF" font-family="Aeonik, sans-serif" font-size="82" font-weight="500" letter-spacing="-1.8">Copy the prompt.</text>
  <text x="72" y="424" fill="#FFFFFF" fill-opacity="0.76" font-family="Geist, sans-serif" font-size="24">Set it up in minutes.</text>
</svg>
